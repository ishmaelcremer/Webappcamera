<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Object Detection</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #000; color: #fff; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  #stage { position: relative; width: 100%; }
  video { display: block; width: 100%; height: auto; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 12px 16px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; padding: 10px 16px; border: 0;
    border-radius: 10px; background: #2f80ed; color: #fff;
  }
  button.secondary { background: #333; }
  button:disabled { opacity: .5; }
  #status { font-size: 14px; opacity: .8; }
  #list { padding: 0 16px 24px; font-size: 14px; opacity: .85; line-height: 1.5; }
</style>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="bar">
    <button id="start">Start camera</button>
    <button id="flip" class="secondary" disabled>Flip</button>
    <span id="status">Tap Start to begin.</span>
  </div>
  <div id="list"></div>

  <!-- TensorFlow.js + pretrained COCO-SSD model (80 object classes) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2"></script>

  <script>
    const video   = document.getElementById('video');
    const canvas  = document.getElementById('overlay');
    const ctx     = canvas.getContext('2d');
    const startBtn = document.getElementById('start');
    const flipBtn  = document.getElementById('flip');
    const statusEl = document.getElementById('status');
    const listEl   = document.getElementById('list');

    const MIN_SCORE = 0.5;   // ignore detections below 50% confidence
    const MAX_BOXES = 20;

    let model = null;
    let stream = null;
    let facing = 'environment';   // rear camera
    let running = false;
    let fps = 0;

    const setStatus = t => statusEl.textContent = t;

    // Give each class a consistent color
    function colorFor(name) {
      let h = 0;
      for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
      return `hsl(${h}, 90%, 55%)`;
    }

    async function loadModel() {
      if (model) return;
      setStatus('Loading model…');
      // lite_mobilenet_v2 is the fastest variant — best for phones
      model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    }

    async function startCamera() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
    }

    function draw(preds) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Scale so lines/text look the same size on screen regardless of camera resolution
      const s  = canvas.width / (video.clientWidth || canvas.width);
      const lw = 3 * s;
      const fs = Math.round(16 * s);
      const pad = 4 * s;
      ctx.font = `600 ${fs}px -apple-system, system-ui, sans-serif`;
      ctx.textBaseline = 'top';

      for (const p of preds) {
        const [x, y, w, h] = p.bbox;
        const color = colorFor(p.class);

        // Box
        ctx.strokeStyle = color;
        ctx.lineWidth = lw;
        ctx.strokeRect(x, y, w, h);

        // Label tag (above the box, or inside if at the top edge)
        const label = `${p.class} ${Math.round(p.score * 100)}%`;
        const tw = ctx.measureText(label).width + pad * 2;
        const th = fs + pad * 2;
        const ly = y - th < 0 ? y : y - th;
        ctx.fillStyle = color;
        ctx.fillRect(x - lw / 2, ly, tw, th);
        ctx.fillStyle = '#000';
        ctx.fillText(label, x - lw / 2 + pad, ly + pad);
      }
    }

    function updateList(preds) {
      if (!preds.length) { listEl.textContent = ''; return; }
      const counts = {};
      preds.forEach(p => counts[p.class] = (counts[p.class] || 0) + 1);
      listEl.textContent = 'Seeing: ' + Object.entries(counts)
        .map(([k, n]) => n > 1 ? `${k} ×${n}` : k).join(', ');
    }

    async function loop() {
      if (!running) return;
      if (video.readyState >= 2 && video.videoWidth) {
        // Match canvas to the camera's real resolution (handles rotation too)
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
        const t0 = performance.now();
        const preds = await model.detect(video, MAX_BOXES, MIN_SCORE);
        const dt = performance.now() - t0;
        fps = fps ? fps * 0.9 + (1000 / dt) * 0.1 : 1000 / dt;

        draw(preds);
        updateList(preds);
        setStatus(`${preds.length} object${preds.length === 1 ? '' : 's'} · ${fps.toFixed(0)} fps`);
      }
      requestAnimationFrame(loop);
    }

    startBtn.addEventListener('click', async () => {
      if (!window.isSecureContext) {
        setStatus('Camera needs HTTPS. Host this page on an https:// site.');
        return;
      }
      startBtn.disabled = true;
      try {
        await loadModel();
        setStatus('Starting camera…');
        await startCamera();
        running = true;
        flipBtn.disabled = false;
        startBtn.textContent = 'Running';
        loop();
      } catch (err) {
        console.error(err);
        startBtn.disabled = false;
        setStatus(err.name === 'NotAllowedError'
          ? 'Camera permission denied. Allow it in your browser settings and retry.'
          : 'Error: ' + err.message);
      }
    });

    flipBtn.addEventListener('click', async () => {
      facing = facing === 'environment' ? 'user' : 'environment';
      try { await startCamera(); } catch (err) { setStatus('Error: ' + err.message); }
    });
  </script>
</body>
</html>
